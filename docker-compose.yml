services:
  db:
    image: postgres:16-alpine
    container_name: dhaka-tesla-pool-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: tesla_pool
      POSTGRES_PASSWORD: tesla_pool_password
      POSTGRES_DB: dhaka_tesla_pool
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tesla_pool -d dhaka_tesla_pool"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dhaka-tesla-pool-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://tesla_pool:tesla_pool_password@db:5432/dhaka_tesla_pool?schema=public
      JWT_SECRET: ${JWT_SECRET:-docker-development-secret}
      FRONTEND_URL: http://localhost:3000
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:5000/api
    container_name: dhaka-tesla-pool-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:5000/api
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data: